<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Toan Thai</title>
<meta name="description" content="Android apps I have designed, built and shipped.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20fill%3D%22%232F5BFF%22%2F%3E%3Cpath%20d%3D%22M12%2044a20%2020%200%200%201%2040%200z%22%20fill%3D%22%23fff%22%20stroke%3D%22%23000%22%20stroke-width%3D%223%22%2F%3E%3Cpath%20d%3D%22M20%2022l-5-8M44%2022l5-8%22%20stroke%3D%22%23000%22%20stroke-width%3D%223.5%22%20stroke-linecap%3D%22square%22%2F%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2235%22%20r%3D%223%22%20fill%3D%22%23000%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2235%22%20r%3D%223%22%20fill%3D%22%23000%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#000;--paper:#F4F5F7;--white:#fff;--blue:#2F5BFF;--blue-tint:#DCE5FF;--line:#E3E5EA;
  --on-blue:#fff;--bd:var(--ink);--dot:rgba(0,0,0,.13);--sk:#E4E6EB;--link-hover:#2F5BFF;
  --bw:3px;--bw-lg:4px;
  --sh-sm:4px 4px 0 var(--ink);--sh:6px 6px 0 var(--ink);--sh-lg:10px 10px 0 var(--ink);
  --f-sans:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --maxw:1100px;--pad:20px;
}
html[data-theme="dark"]{--shc:#000;color-scheme:dark;--sh-sm:4px 4px 0 var(--shc);--sh:6px 6px 0 var(--shc);--sh-lg:10px 10px 0 var(--shc);--link-hover:#A9BCFF}
/* dark · Graphite */
html[data-theme="dark"]{--ink:#ECE7DC;--bd:#ECE7DC;--paper:#1F1F1E;--white:#2B2B29;--blue-tint:#3A4466;--line:#3A3A37;--dot:rgba(236,231,220,.14);--sk:#333331;--shc:#000}
html[data-theme="dark"] .btn:hover,html[data-theme="dark"] .btn:active,html[data-theme="dark"] .shot:hover,html[data-theme="dark"] .stack-list li:hover,html[data-theme="dark"] .stack-list li:active{box-shadow:0 0 0 var(--shc)}
html[data-theme="dark"] .foot{background:#111}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--f-sans);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:24px 24px}
a{color:var(--ink);text-underline-offset:3px}
a:hover{color:var(--link-hover)}
img{display:block}
:focus-visible{outline:3px solid var(--bd);outline-offset:3px}
.wrap{max-width:calc(var(--maxw) + var(--pad)*2);margin:0 auto;padding:0 var(--pad)}
.mono{font-family:var(--f-mono);font-size:13px;letter-spacing:.02em;text-transform:uppercase}
.skip{position:absolute;left:-999px;top:8px;background:var(--white);border:var(--bw) solid var(--bd);padding:8px 12px;z-index:50}
.skip:focus{left:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 18px;border:var(--bw) solid var(--bd);background:var(--white);color:var(--ink);
  font:800 16px/1 var(--f-sans);font-stretch:108%;text-decoration:none;box-shadow:var(--sh-sm);cursor:pointer;transition:transform .08s ease,box-shadow .08s ease;white-space:nowrap}
.btn:hover,.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);color:var(--ink)}
.btn svg{width:20px;height:20px;flex:none}
.btn--primary{background:var(--blue);color:var(--on-blue)}
.btn--primary:hover,.btn--primary:active{color:var(--on-blue)}
.btn--icon{width:48px;padding:0;justify-content:center}
.btn--sm{min-height:40px;padding:0 12px;font-size:14px}
.btn--sm.btn--icon{width:40px}

/* top bar (pinned) */
.topbar{position:sticky;top:0;z-index:50;background:var(--paper);--tb-sh:rgba(15,23,42,.10);transition:background-color .2s ease,box-shadow .2s ease}
/* stuck: frosted paper + soft drop shadow instead of a black rule */
.topbar.stuck{background:color-mix(in srgb,var(--paper) 82%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);box-shadow:0 1px 0 var(--tb-sh),0 8px 24px -12px var(--tb-sh)}
html[data-theme="dark"] .topbar{--tb-sh:rgba(0,0,0,.55)}
[id]{scroll-margin-top:84px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:20px;padding-bottom:20px}
.brand{font:800 15px/1 var(--f-mono);text-decoration:none;text-transform:uppercase;letter-spacing:.04em}
.top nav{display:flex;gap:20px}
.top nav a{font:700 15px/1 var(--f-sans);text-decoration:none}
.top nav a:hover{text-decoration:underline;text-decoration-thickness:3px}
.top-r{display:flex;align-items:center;gap:20px}
.theme-btn .i-sun{display:none}
html[data-theme="dark"] .theme-btn .i-sun{display:block}
html[data-theme="dark"] .theme-btn .i-moon{display:none}

/* hero */
.hero{display:block;padding-top:40px;padding-bottom:72px}
.hero-id{margin-bottom:14px}
.hero-top{display:grid;grid-template-columns:132px minmax(0,1fr);gap:28px;align-items:center;margin-bottom:24px}
.hero-top h1{margin:0}
.hero-avatar{width:100%;max-width:132px}
.avatar{width:100%;height:auto;max-width:132px;max-height:132px;aspect-ratio:1/1;border:var(--bw-lg) solid var(--bd);box-shadow:var(--sh-sm);object-fit:cover;background:var(--blue-tint);display:block}
.avatar-fb{display:grid;place-content:center;justify-items:center;gap:12px;background:var(--blue);color:var(--on-blue);font:900 44px/1 var(--f-sans);font-stretch:115%}
.avatar-fb small{font:700 13px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.04em}
.hero h1{margin:0 0 20px;font:900 clamp(34px,5vw,60px)/.95 var(--f-sans);font-stretch:118%;letter-spacing:-.02em;text-transform:uppercase;text-wrap:balance}
.bio{margin:0 0 28px;font-size:20px;max-width:44ch;text-wrap:pretty}
.actions{display:flex;flex-wrap:wrap;gap:14px}
.stats{margin:0;background:var(--white);border:var(--bw) solid var(--bd);box-shadow:var(--sh)}
.stats div{padding:18px 22px}
.stats div+div{border-top:var(--bw) solid var(--bd)}
.stats dt{order:2}
.stats div{display:flex;flex-direction:column}
.stats dd{margin:0;font:900 72px/.95 var(--f-sans);font-stretch:118%;font-variant-numeric:tabular-nums}
.stats div+div dd{font-size:40px}

/* section heads */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:var(--bw-lg) solid var(--bd);padding-bottom:12px;margin-bottom:36px}
.sec-head h2{margin:0;font:900 clamp(28px,4vw,42px)/1 var(--f-sans);font-stretch:115%;text-transform:uppercase;letter-spacing:-.01em}

/* apps */
.apps{display:flex;flex-direction:column;gap:44px;margin:0;padding:0;list-style:none}
.apps--stagger{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:36px;align-items:start}
.apps--stagger .col{display:flex;flex-direction:column;gap:44px;margin:0;padding:0;list-style:none}
.app{position:relative;container-type:inline-size;background:var(--white);border:var(--bw) solid var(--bd);box-shadow:var(--sh)}
.app-in{padding:28px;display:flex;flex-direction:column;gap:20px}
.app-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center}
.icon{width:76px;height:76px;border-radius:22%;border:var(--bw) solid var(--bd);object-fit:cover;background:transparent;overflow:hidden}
.icon-fb{display:grid;place-items:center;background:var(--blue);color:var(--on-blue);font:900 26px/1 var(--f-sans);font-stretch:115%}
.app h3{margin:0;font:900 32px/1.02 var(--f-sans);font-stretch:112%;letter-spacing:-.01em;text-wrap:balance}
.tagline{margin:6px 0 0;font-size:17px;font-weight:600}
.chips,.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border:2px solid var(--bd);background:var(--blue-tint);font:700 13px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.02em}
.tag{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border:2px solid var(--bd);background:var(--white);font:500 13px/1 var(--f-mono)}
.desc{margin:0;max-width:68ch;text-wrap:pretty}
.role{margin:0;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.role b{font:700 13px/1.4 var(--f-mono);text-transform:uppercase}
.meta{display:flex;flex-direction:column;gap:14px}

/* screenshot strip */
.shots{--h:440px;border-top:var(--bw) solid var(--bd);background:var(--white);padding:16px 0 0}
.shots[data-orient="landscape"]{--h:320px}
.shots-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 28px 12px}
.shots-nav{display:flex;gap:10px}
.strip{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 28px;padding:4px 28px 26px;
  scrollbar-width:thin;scrollbar-color:var(--ink) transparent;overscroll-behavior-x:contain}
.strip::-webkit-scrollbar{height:10px}
.strip::-webkit-scrollbar-thumb{background:var(--ink)}
.shot{flex:none;scroll-snap-align:start;padding:0;margin:0;border:var(--bw) solid var(--bd);background:var(--blue-tint);box-shadow:var(--sh-sm);cursor:zoom-in;transition:transform .08s ease,box-shadow .08s ease;height:calc(var(--h) + var(--bw)*2)}
.shot:hover{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.shot img{height:var(--h);width:auto;max-width:none}
.shot.loading{min-width:calc(var(--h) * .5625)}
.shots[data-orient="landscape"] .shot.loading{min-width:calc(var(--h) * 1.7778)}
.shot.loading img{opacity:0}
.shot-fb{height:var(--h);aspect-ratio:9/16;display:grid;place-content:center;justify-items:center;gap:10px;background:var(--blue-tint);cursor:default}
.shots[data-orient="landscape"] .shot-fb{aspect-ratio:16/9}
.shot-fb strong{font:900 44px/1 var(--f-sans);font-stretch:115%}

/* featured */
.is-featured{box-shadow:var(--sh-lg);border-width:var(--bw-lg)}
.sticker{position:absolute;top:-17px;left:22px;z-index:2;background:var(--ink);color:var(--white);border:var(--bw) solid var(--bd);padding:6px 10px;font:700 13px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;transform:rotate(-2deg)}
.is-featured{box-shadow:10px 10px 0 var(--blue)}
.is-featured .sticker{background:var(--blue);border-color:var(--ink)}

@container (max-width:640px){
  .app-in{padding:22px 20px}
  .app-head{grid-template-columns:auto minmax(0,1fr)}
  .app-cta{grid-column:1/-1}
  .app-cta .btn{width:100%;justify-content:center}
  .icon{width:64px;height:64px}
  .app h3{font-size:26px}
  .shots{--h:380px}
  .shots[data-orient="landscape"]{--h:190px}
  .shots-bar{padding:0 20px 12px}
  .strip{padding:4px 20px 22px;scroll-padding:0 20px;gap:14px}
}

/* stack */
.stack{padding-top:96px}
.stack-list{display:flex;flex-wrap:wrap;gap:14px;margin:0;padding:0;list-style:none}
.stack-list{gap:12px}
.stack-list li{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 16px 0 13px;border:var(--bw) solid var(--bd);background:var(--white);box-shadow:var(--sh-sm);
  font:800 16px/1.1 var(--f-sans);font-stretch:108%;transition:transform .08s ease,box-shadow .08s ease,background-color .08s ease}
.stack-list li::before{content:"";flex:none;width:10px;height:10px;background:var(--blue);border:2px solid var(--bd)}
.stack-list li:hover,.stack-list li:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);background:var(--blue-tint)}
/* most-used: solid blue */
.stack-list li.core{background:var(--blue);color:var(--on-blue)}
.stack-list li.core::before{background:var(--on-blue)}
.stack-list li.core:hover,.stack-list li.core:active{background:var(--blue)}

/* footer */
.foot{margin-top:112px;background:#000;color:#fff;border-top:var(--bw) solid var(--bd);padding:72px 0 28px}
.foot h2{margin:0 0 16px;font:900 clamp(30px,4.2vw,48px)/1 var(--f-sans);font-stretch:118%;text-transform:uppercase;letter-spacing:-.02em}
.foot .mail{display:inline-block;color:#fff;font:800 clamp(20px,3vw,30px)/1.2 var(--f-sans);text-decoration-thickness:3px;margin-bottom:32px;word-break:break-all}
.foot .mail:hover{color:#9DB4FF}
.foot .btn{border-color:#fff;box-shadow:4px 4px 0 #fff}
.foot .btn:hover{box-shadow:0 0 0 #fff}
.foot .btn--primary{border-color:#fff}
.foot :focus-visible{outline-color:#fff}
.foot-base{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:64px;padding-top:20px;border-top:2px solid #444;color:#BDBDBD}
.foot-base .lab{color:#fff;font-weight:700;text-transform:none;text-decoration-thickness:2px}
.foot-base a.lab:hover{color:#9DB4FF}

/* states */
.sk{background:var(--sk);border:var(--bw) solid var(--bd)}
@keyframes pulse{50%{opacity:.55}}
.sk-anim{animation:pulse 1.2s ease-in-out infinite}
.state{max-width:620px;margin:40px auto 120px;background:var(--white);border:var(--bw-lg) solid var(--bd);box-shadow:var(--sh-lg)}
.state-bar{background:var(--ink);color:var(--white);padding:10px 16px}
.state-in{padding:28px}
.state h1{margin:0 0 10px;font:900 34px/1.05 var(--f-sans);font-stretch:112%}
.state p{margin:0 0 14px}
.state code{font:500 14px var(--f-mono);background:var(--blue-tint);border:2px solid var(--bd);padding:1px 6px}
.state pre{margin:0 0 20px;padding:12px;border:2px solid var(--bd);background:var(--paper);font:500 13px/1.5 var(--f-mono);white-space:pre-wrap;word-break:break-word}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;display:none;grid-template-rows:auto minmax(0,1fr) auto;background:rgba(0,0,0,.92);color:#fff}
.lb.open{display:grid}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px}
.lb-stage{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;padding:0 20px;min-height:0}
.lb-fig{margin:0;display:grid;place-items:center;min-height:0;height:100%}
.lb-fig img{max-width:100%;max-height:calc(100vh - 150px);width:auto;height:auto;border:var(--bw-lg) solid #fff;background:var(--blue-tint)}
.lb-bottom{padding:14px 20px 20px;text-align:center}
.lb .btn{border-color:#000;background:#fff;color:#000;box-shadow:4px 4px 0 #000}
@media (max-width:640px){
  .lb-stage{grid-template-columns:1fr;padding:0 12px}
  .lb-stage .lb-prev,.lb-stage .lb-next{display:none}
  .lb-bottom{display:flex;justify-content:space-between;align-items:center}
}
@media (min-width:641px){.lb-bottom .lb-prev,.lb-bottom .lb-next{display:none}}

/* card → detail */
.app[data-slug]{cursor:pointer}
.app-link{color:inherit;text-decoration:none}
.app-link:hover{color:inherit;text-decoration:underline;text-decoration-thickness:3px}
.app .desc{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.app-more{display:flex}

/* detail */
.detail{padding-top:8px}
.d-back{margin-bottom:32px}
.d-hero{position:relative;background:var(--white);border:var(--bw-lg) solid var(--bd);box-shadow:10px 10px 0 var(--blue);padding:32px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px 28px;align-items:center;margin-bottom:56px}
.d-iconwrap .icon{width:120px;height:120px}
.d-hero h1{margin:0;font:900 clamp(36px,5.5vw,64px)/.95 var(--f-sans);font-stretch:118%;letter-spacing:-.02em;text-transform:uppercase;text-wrap:balance}
.d-hero h1:focus{outline:none}
.d-hero .tagline{font-size:19px;margin-top:10px}
.d-hero .actions{grid-column:1/-1}
.d-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:36px;align-items:start}
.d-main,.d-side{display:flex;flex-direction:column;gap:36px}
.d-side{position:sticky;top:24px}
.d-box{background:var(--white);border:var(--bw) solid var(--bd);box-shadow:var(--sh)}
.d-label{margin:0;padding:10px 16px;background:var(--ink);color:var(--white);font-weight:700}
.d-body{padding:22px 24px}
.d-body p{margin:0 0 14px;max-width:68ch;text-wrap:pretty}
.d-body p:last-child{margin-bottom:0}
.d-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.d-list li{position:relative;padding-left:26px}
.d-list li::before{content:"";position:absolute;left:0;top:.45em;width:12px;height:12px;background:var(--blue);border:2px solid var(--bd)}
.d-ch{margin:0;padding:0;list-style:none;counter-reset:ch;display:flex;flex-direction:column;gap:20px}
.d-ch li{counter-increment:ch;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px}
.d-ch li::before{content:counter(ch,decimal-leading-zero);grid-row:span 2;align-self:start;padding:6px 8px;border:2px solid var(--bd);background:var(--blue-tint);font:700 13px/1 var(--f-mono)}
.d-ch h3{margin:0;font:800 19px/1.25 var(--f-sans);font-stretch:108%}
.d-ch p{margin:0}
.d-facts{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 16px;align-items:baseline}
.d-facts dt{font:700 13px/1.5 var(--f-mono);text-transform:uppercase}
.d-facts dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.d-links{display:flex;flex-direction:column;gap:14px}
.d-links .btn{justify-content:space-between}
.d-empty{margin:0;font:500 14px/1.5 var(--f-mono);opacity:.7}
.d-shots{margin-top:72px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px}
.gallery[data-orient="landscape"]{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.gallery .shot{height:auto;width:100%}
.gallery .shot img{width:100%;height:auto}
.gallery .shot.loading{min-width:0;aspect-ratio:9/16}
.gallery[data-orient="landscape"] .shot.loading{aspect-ratio:16/9}
.gallery .shot-fb{height:auto;width:100%}
.d-pager{margin-top:72px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.d-pager .btn{min-height:84px;gap:16px;white-space:normal}
.d-pager .prev{justify-content:flex-start}
.d-pager .next{justify-content:flex-end}
.d-pager .btn span{display:flex;flex-direction:column;gap:6px}
.d-pager .btn small{font:700 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;opacity:.7}
.d-pager .btn b{font:900 22px/1.05 var(--f-sans);font-stretch:112%}
.d-pager .next{text-align:right}
.d-pager .next span{align-items:flex-end}
@media (max-width:880px){
  .d-grid{grid-template-columns:minmax(0,1fr)}
  .d-side{position:static}
}
@media (max-width:640px){
  .d-hero{grid-template-columns:auto minmax(0,1fr);padding:22px 20px;gap:18px}
  .d-iconwrap .icon{width:76px;height:76px}
  .d-hero .actions .btn{flex:1 1 100%;justify-content:center}
  .d-body{padding:18px 20px}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .gallery[data-orient="landscape"]{grid-template-columns:minmax(0,1fr)}
  .d-pager{grid-template-columns:minmax(0,1fr)}
}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;gap:32px;padding-top:16px;padding-bottom:56px}
  .hero-top{grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
  .hero-avatar,.avatar{max-width:88px;max-height:88px}
  .avatar{border-width:var(--bw)}
  .avatar-fb{font-size:30px}
  .avatar-fb small{display:none}
  .bio{font-size:18px}
}
@media (max-width:480px){
  :root{--pad:16px}
  .top nav{gap:12px}
  .top-r{gap:12px}
  .top nav a{font-size:14px}
  .actions .btn--primary{flex:1 1 100%;justify-content:center}
  .apps{gap:36px}
}
/* ---------- motion fx: high-tech layer, hard-edged to match the style ----------
   Gated by html.fx (added by JS only when reduced motion is off), so no-JS / reduced motion = static page. */
@keyframes blink{50%{opacity:0}}
.caret{display:inline-block;width:.62em;height:1.05em;margin-left:6px;background:var(--blue);vertical-align:-.2em;animation:blink 1.06s steps(1) infinite}
.foot .caret{width:.42em;height:.76em;margin-left:.12em;vertical-align:0}
.sticker::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;background:currentColor;vertical-align:1px;animation:blink 1.06s steps(1) infinite}

/* scroll progress + pointer spotlight on the dot grid */
.progress{position:fixed;left:0;top:0;right:0;height:4px;z-index:60;background:var(--blue);transform-origin:0 50%;transform:scaleX(var(--p,0));pointer-events:none}
.grid-fx{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .25s}
/* three depth layers: a deep offset grid that drifts against the pointer (parallax), the lit grid, and a bright core */
.grid-fx i{position:absolute;inset:0;background-size:24px 24px;
  -webkit-mask-image:radial-gradient(var(--r) circle at var(--mx,50%) var(--my,50%),#000 0,rgba(0,0,0,.45) 50%,transparent 100%);
  mask-image:radial-gradient(var(--r) circle at var(--mx,50%) var(--my,50%),#000 0,rgba(0,0,0,.45) 50%,transparent 100%)}
.grid-fx .far{--r:260px;opacity:.5;background-image:radial-gradient(var(--link-hover) 1px,transparent 1.4px);
  background-position:calc(12px + var(--px,0px)) calc(12px + var(--sy,0px) + var(--py,0px))}
.grid-fx .mid{--r:170px;background-image:radial-gradient(var(--link-hover) 1.7px,transparent 2.1px);background-position:0 var(--sy,0px)}
.grid-fx .near{--r:70px;background-image:radial-gradient(var(--link-hover) 2.8px,transparent 3.3px);background-position:0 var(--sy,0px)}
.grid-fx.on{opacity:1}
.grid-fx.on.dim{opacity:0}

/* name: each letter decodes from a blue block */
.type .w{white-space:nowrap}
.fx .type .ch{animation:decode .22s linear backwards;animation-delay:calc(var(--i)*38ms + 150ms)}
@keyframes decode{0%{color:transparent;background:transparent}1%,65%{color:transparent;background:var(--blue);animation-timing-function:steps(1,start)}}

/* mono labels: scramble overlay */
.scr-host{position:relative;-webkit-text-fill-color:transparent}
.scr{position:absolute;left:0;top:0;white-space:pre;-webkit-text-fill-color:currentColor;pointer-events:none}

/* brand: RGB-split glitch on hover */
.brand{display:inline-block}
.brand:hover{color:var(--ink)}
.fx .brand:hover{animation:glitch .36s steps(1)}
@keyframes glitch{0%{text-shadow:3px 0 var(--blue);transform:translate(-2px,0)}25%{text-shadow:-3px 0 var(--blue);transform:translate(2px,1px)}50%{text-shadow:2px -1px var(--blue);transform:translate(-1px,-1px)}75%{text-shadow:-2px 0 var(--blue);transform:none}100%{text-shadow:none}}

/* reveal on scroll: blocks "stamp" into place, hard shadow lands last */
.fx .rv:not(.in):not(.done){opacity:0}
.fx .rv.in{animation:stamp .55s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:var(--d,0ms)}
@keyframes stamp{0%{opacity:0;transform:translate(10px,14px);box-shadow:0 0 0 transparent}60%{opacity:1}}

/* section rule draws in, led by a blue scanner block */
.sec-head{position:relative}
.fx .sec-head{border-bottom-color:transparent}
.fx .sec-head::after{content:"";position:absolute;left:0;right:0;bottom:calc(var(--bw-lg)*-1);height:var(--bw-lg);background:var(--bd);transform:scaleX(0);transform-origin:0 50%}
.fx .sec-head.done::after{transform:none}
.fx .sec-head.in::after{transform:none;transition:transform .8s cubic-bezier(.7,0,.15,1) var(--d,0ms)}
.fx .sec-head::before{content:"";position:absolute;left:0;bottom:calc(var(--bw-lg)*-1 - 4px);width:12px;height:calc(var(--bw-lg) + 8px);background:var(--blue);opacity:0}
.fx .sec-head.in::before{animation:sweep .8s cubic-bezier(.7,0,.15,1) var(--d,0ms) both}
@keyframes sweep{0%{opacity:1;left:0}92%{opacity:1;left:calc(100% - 12px)}100%{opacity:0;left:calc(100% - 12px)}}

/* loading: stepped scan instead of a soft pulse; screenshots raster in */
.sk-anim,.shot.loading{--scan:rgba(47,91,255,.22);background-image:linear-gradient(90deg,transparent 0 35%,var(--scan) 35% 65%,transparent 65%);background-size:300% 100%;background-repeat:no-repeat;animation:skscan 1.2s steps(14) infinite}
@keyframes skscan{from{background-position:100% 0}to{background-position:0 0}}
.fx .shot.lit img{animation:raster .6s steps(10,end) backwards}
@keyframes raster{from{clip-path:inset(0 0 100% 0)}}

  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
}

        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
      </button>
    </div>
  </div></header>
  <div id="home">
  <main>
    <section class="hero wrap" id="top">
      <div>
        <div class="hero-top">
          <div class="hero-avatar">${avatar}</div>
          <div>${eyebrow?`<div class="hero-id"><p class="mono" id="eyebrow" style="margin:0">${eyebrow}<span class="caret" aria-hidden="true"></span></p></div>`:''}${FX?`<h1 class="type" aria-label="${esc(name)}"><span aria-hidden="true">${typeHTML(name)}</span></h1>`:`<h1>${esc(name)}</h1>`}</div>
        </div>
        ${P.bio?`<p class="bio" data-d="${typeEnd(name)}">${esc(P.bio)}</p>`:''}
        <div class="actions" data-d="${typeEnd(name)+140}">${contactButtons(L, true)}</div>
      </div>
    </section>
    <section class="wrap" id="apps" aria-labelledby="apps-h">
      <div class="sec-head"><h2 id="apps-h">Shipped apps</h2><span class="mono">${String(apps.length).padStart(2,'0')} total</span></div>
      ${apps.length ? `<div id="apps-list">${appsListHTML()}</div>`
        : `<div class="state" style="margin:0"><div class="state-in"><h1>No apps yet.</h1><p>Add an entry to <code>apps</code> in <code>apps.json</code>.</p></div></div>`}
    </section>
    ${stackList.length?`
    <section class="wrap stack" id="stack" aria-labelledby="stack-h">
      <div class="sec-head"><h2 id="stack-h">Stack</h2><span class="mono">Across all apps</span></div>
      <ul class="stack-list">${stackList.map(s=>`<li${s.n>2?' class="core"':''}>${esc(s.t)}</li>`).join('')}</ul>
    </section>`:''}
  </main>
  </div>
  <div id="detail" hidden></div>
  <footer class="foot" id="contact">
    <div class="wrap">
      <p class="mono" style="margin:0 0 16px;color:#BDBDBD">Contact</p>
      <h2>Say hi!<span class="caret" aria-hidden="true"></span></h2>
      ${L.email?`<a class="mail" href="mailto:${esc(L.email)}">${esc(L.email)}</a>`:''}
      <div class="actions">${contactButtons(L, true)}</div>
      <div class="foot-base mono"><span>© ${new Date().getFullYear()} ${esc(name)} <span aria-hidden="true">·</span> ${LAB_URL?`<a class="lab" href="${esc(LAB_URL)}" target="_blank" rel="noopener">ÊĐEN Lab</a>`:'<span class="lab">ÊĐEN Lab</span>'}</span></div>
    </div>
  </footer>`;
  wireImages(root);
  fxScan(root);
  const eb = document.getElementById('eyebrow'); if(eb) scramble(eb, 900);
  document.getElementById('theme-btn').onclick = e=>{
    const d = document.documentElement, dark = d.dataset.theme !== 'dark';
    d.dataset.theme = dark ? 'dark' : 'light';
    e.currentTarget.setAttribute('aria-pressed', dark);
  };
}

const wideMQ = matchMedia('(min-width: 900px)');
function appsListHTML(){
  const {apps} = DATA;
  const n = wideMQ.matches && apps.length > 1 ? 2 : 1;
  const cols = Array.from({length:n}, ()=>({h:0, items:[]}));
  apps.forEach((a, idx)=>{
    const w = 2 + (a.shots.length ? 4 : 0) + Math.min(a.description.length, 300)/220 + .5 + (a.tech.length ? .5 : 0) + (a.role ? .5 : 0);
    const c = idx < n ? cols[idx] : cols.reduce((m,c)=>c.h < m.h ? c : m);
    c.items.push(a); c.h += w;
  });
  return `<div class="apps--stagger" style="--cols:${n}">${cols.map(c=>`<ul class="col">${c.items.map(appHTML).join('')}</ul>`).join('')}</div>`;
}
wideMQ.addEventListener('change', ()=>{
  const el = document.getElementById('apps-list');
  if(el && DATA){ el.innerHTML = appsListHTML(); wireImages(el); fxScan(el, true); }
});

/* ---------- images ---------- */
function wireImages(scope){
  scope.querySelectorAll('img[data-fb]').forEach(img=>{
    const fail = ()=>{
      const d = document.createElement('div');
      d.className = img.dataset.fbclass || 'icon icon-fb';
      d.setAttribute('role','img'); d.setAttribute('aria-label', img.alt);
      d.textContent = img.dataset.fb;
      img.replaceWith(d);
    };
    if(img.complete && img.naturalWidth===0) fail(); else img.addEventListener('error', fail, {once:true});
  });
  scope.querySelectorAll('.shot img').forEach(img=>{
    const btn = img.parentElement, strip = btn.closest('.shots,.gallery');
    const ok = live=>{
      btn.classList.remove('loading');
      if(FX && live === true) btn.classList.add('lit');
      if(!strip.dataset.orient) strip.dataset.orient = img.naturalWidth > img.naturalHeight ? 'landscape' : 'portrait';
    };
    const fail = ()=>{
      const a = DATA.apps.find(x=>x.i==btn.dataset.app);
      const d = document.createElement('div');
      d.className = 'shot shot-fb';
      d.setAttribute('role','img'); d.setAttribute('aria-label', img.alt + ' (unavailable)');
      d.innerHTML = `<strong>${esc(initials(a && a.name))}</strong><span class="mono">Image unavailable</span>`;
      btn.replaceWith(d);
    };
    if(img.complete){ img.naturalWidth ? ok() : fail(); }
    else { img.addEventListener('load', ()=>ok(true), {once:true}); img.addEventListener('error', fail, {once:true}); }
  });
}

/* ---------- detail ---------- */
const LINK_LABELS = {github:'Source on GitHub', website:'Website', privacy:'Privacy policy', terms:'Terms of use', video:'Demo video', appStore:'App Store'};
const box = (label, body) => body ? `<section class="d-box"><h2 class="d-label mono">${esc(label)}</h2><div class="d-body">${body}</div></section>` : '';
function detailHTML(a){
  const apps = DATA.apps, idx = apps.indexOf(a), n = a.shots.length;
  const isPlay = /play\.google\.com/.test(a.url);
  const facts = [
    isPlay && ['Platform','Android'],
    a.category && ['Category', a.category],
    a.released && ['Released', a.released],
    a.downloads && ['Downloads', a.downloads],
    a.rating!=='' && ['Rating', '★ ' + Number(a.rating).toFixed(1)],
    n && ['Screens', String(n)],
    a.packageId && ['Package', a.packageId]
  ].filter(Boolean);
  const links = Object.entries(a.links).filter(([,u])=>u).map(([k,u])=>
    `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${esc(LINK_LABELS[k] || k)}${k==='github'?I.gh:I.arrow}</a>`).join('');
  const main = [
    box('About', paras(a.overview || a.description)),
    box('My role', paras(a.role)),
    a.features.length && box('Features', `<ul class="d-list">${a.features.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`),
    box('Architecture', paras(a.architecture)),
    a.challenges.length && box('Challenges', `<ol class="d-ch">${a.challenges.map(c=>`<li><h3>${esc(c.title)}</h3>${c.detail?`<p>${esc(c.detail)}</p>`:''}</li>`).join('')}</ol>`)
  ].filter(Boolean).join('');
  const side = [
    a.tech.length && box('Tech stack', `<ul class="tags">${a.tech.map(t=>`<li class="tag">${esc(t)}</li>`).join('')}</ul>`),
    facts.length && box('Facts', `<dl class="d-facts">${facts.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`),
    links && box('Links', `<div class="d-links">${links}</div>`)
  ].filter(Boolean).join('');
  const prev = apps[(idx - 1 + apps.length) % apps.length], next = apps[(idx + 1) % apps.length];
  return `
  <main class="wrap detail" aria-labelledby="d-title">
    <a class="btn btn--sm d-back" href="#apps" data-back>${I.left}All apps</a>
    <header class="d-hero">
      ${a.featured?'<span class="sticker">Featured</span>':''}
      <div class="d-iconwrap">${iconHTML(a)}</div>
      <div>${FX?`<h1 id="d-title" tabindex="-1" class="type" aria-label="${esc(a.name)}"><span aria-hidden="true">${typeHTML(a.name)}</span></h1>`:`<h1 id="d-title" tabindex="-1">${esc(a.name)}</h1>`}${a.tagline?`<p class="tagline">${esc(a.tagline)}</p>`:''}</div>
      ${a.url?`<div class="actions"><a class="btn btn--primary" href="${esc(a.url)}" target="_blank" rel="noopener">${isPlay?I.play+'View on Google Play':'Visit'+I.arrow}</a></div>`:''}
    </header>
    ${main || side ? `<div class="d-grid"><div class="d-main">${main || box('About', '<p class="d-empty">Details coming soon.</p>')}</div>${side?`<aside class="d-side" aria-label="${esc(a.name)} details">${side}</aside>`:''}</div>` : ''}
    ${n ? `
    <section class="d-shots" aria-labelledby="d-shots-h">
      <div class="sec-head"><h2 id="d-shots-h">Screens</h2><span class="mono">${String(n).padStart(2,'0')} total</span></div>
      <div class="gallery" data-app="${a.i}">
        ${a.shots.map((s,k)=>`<button class="shot loading" type="button" data-app="${a.i}" data-k="${k}" aria-label="Open ${esc(a.name)} screenshot ${k+1} of ${n}"><img src="${esc(sized(s,'w1000-h1000'))}" alt="${esc(a.name)} screenshot ${k+1} of ${n}" loading="${k<4?'eager':'lazy'}" decoding="async"></button>`).join('')}
      </div>
    </section>` : ''}
    ${apps.length > 1 ? `
    <nav class="d-pager" aria-label="More apps">
      <a class="btn prev" href="${appHref(prev)}" data-replace>${I.left}<span><small>Previous app</small><b>${esc(prev.name)}</b></span></a>
      ${next !== prev ? `<a class="btn next" href="${appHref(next)}" data-replace><span><small>Next app</small><b>${esc(next.name)}</b></span>${I.right}</a>` : ''}
    </nav>` : ''}
  </main>`;
}
function notFoundHTML(){
  return `<main class="wrap"><div class="state" role="alert"><div class="state-bar mono">404 · App</div><div class="state-in">
    <h1 id="d-title" tabindex="-1">App not found.</h1><p>There’s no app at this link. It may have been renamed.</p>
    <div class="actions" style="margin-top:20px"><a class="btn btn--primary" href="#apps" data-back>${I.left}All apps</a></div></div></div></main>`;
}

/* ---------- router ----------
   Home is rendered once and only hidden while a detail view is open, so going back never re-renders it.
   Each history entry remembers its scroll position (history.state.y), restored on back/forward. */
if('scrollRestoration' in history) history.scrollRestoration = 'manual';
let view = null, lastSlug = null, homeBehind = false;
const routeSlug = () => { const m = location.hash.match(/^#\/app\/([^/?#]+)/); return m ? decodeURIComponent(m[1]) : null; };
const saveY = () => history.replaceState(Object.assign({}, history.state, {y: scrollY}), '');
function jump(y){
  const h = document.documentElement, b = h.style.scrollBehavior;
  h.style.scrollBehavior = 'auto'; scrollTo(0, y); h.style.scrollBehavior = b;
}
function route(){
  const home = document.getElementById('home'), det = document.getElementById('detail');
  if(!DATA || !home) return;
  if(lb.classList.contains('open')) closeLb(true);
  const y = history.state && typeof history.state.y === 'number' ? history.state.y : null;
  const slug = routeSlug(), was = view;
  if(slug){
    const a = DATA.apps.find(x=>x.slug===slug);
    if(was === 'home') homeBehind = true;
    det.innerHTML = a ? detailHTML(a) : notFoundHTML();
    home.hidden = true; det.hidden = false;
    wireImages(det);
    fxScan(det);
    document.title = a ? `${a.name} | ${SITE_NAME()}` : `App not found | ${SITE_NAME()}`;
    view = 'detail'; lastSlug = slug;
    jump(y ?? 0);
    const h = document.getElementById('d-title'); if(h) h.focus({preventScroll:true});
    return;
  }
  view = 'home';
  if(was === 'home') return;            // in-page anchor: the browser scrolls natively
  const id = location.hash.slice(1), el = id && document.getElementById(id);
  if(was === 'detail'){
    det.hidden = true; det.innerHTML = ''; home.hidden = false; homeBehind = false;
    document.title = HOME_TITLE();
    const link = lastSlug && home.querySelector(`.app[data-slug="${CSS.escape(lastSlug)}"] .app-link`);
    if(link) link.focus({preventScroll:true});
  }
  if(y !== null) jump(y);
  else if(el) jump(el.getBoundingClientRect().top + scrollY - topOffset());
  else if(was === 'detail') jump(0);
}
addEventListener('hashchange', route);

/* ---------- interactions ---------- */
root.addEventListener('click', e=>{
  const back = e.target.closest('[data-back]');
  if(back){ if(homeBehind){ e.preventDefault(); history.back(); } return; }
  const go = e.target.closest('a[href^="#/app/"]');
  if(go){
    if(go.hasAttribute('data-replace')){ e.preventDefault(); location.replace(go.getAttribute('href')); }
    else saveY();
    return;
  }
  const sc = e.target.closest('[data-scroll]');
  if(sc){
    const strip = sc.closest('.shots').querySelector('.strip');
    strip.scrollBy({left: sc.dataset.scroll * strip.clientWidth * .8, behavior: reduce?'auto':'smooth'});
    return;
  }
  const shot = e.target.closest('button.shot');
  if(shot) return openLb(+shot.dataset.app, +shot.dataset.k, shot);
  const card = e.target.closest('.app[data-slug]');
  if(card && !e.target.closest('a,button,.shots') && !String(getSelection())){
    saveY(); location.hash = '#/app/' + encodeURIComponent(card.dataset.slug);
  }
});

const lb = document.getElementById('lb'), lbImg = document.getElementById('lb-img');
let cur = null, lastFocus = null;
function lbShow(){
  const a = DATA.apps.find(x=>x.i===cur.app), n = a.shots.length;
  lbImg.src = sized(a.shots[cur.k], 'w2400-h2400');
  lbImg.alt = `${a.name} screenshot ${cur.k+1} of ${n}`;
  document.getElementById('lb-title').textContent = a.name;
  document.getElementById('lb-count').textContent = `${cur.k+1} / ${n}`;
  lb.querySelectorAll('.lb-prev,.lb-next').forEach(b=>b.style.visibility = n>1 ? 'visible':'hidden');
}
function openLb(app, k, from){
  cur = {app, k}; lastFocus = from || document.activeElement;
  lb.hidden = false; lb.classList.add('open'); document.body.style.overflow='hidden';
  lbShow(); lb.querySelector('.lb-close').focus();
}
function closeLb(silent){
  lb.classList.remove('open'); lb.hidden = true; document.body.style.overflow=''; lbImg.removeAttribute('src');
  if(!silent && lastFocus && lastFocus.focus) lastFocus.focus();
}
function step(d){
  const n = DATA.apps.find(x=>x.i===cur.app).shots.length;
  cur.k = (cur.k + d + n) % n; lbShow();
}
lb.addEventListener('click', e=>{
  if(e.target.closest('.lb-close')) return closeLb();
  if(e.target.closest('.lb-prev')) return step(-1);
  if(e.target.closest('.lb-next')) return step(1);
  if(!e.target.closest('img,button')) closeLb();
});
document.addEventListener('keydown', e=>{
  if(!lb.classList.contains('open')) return;
  if(e.key==='Escape') closeLb();
  else if(e.key==='ArrowLeft') step(-1);
  else if(e.key==='ArrowRight') step(1);
  else if(e.key==='Tab'){
    const f = [...lb.querySelectorAll('button')].filter(b=>b.offsetParent && b.style.visibility!=='hidden');
    const i = f.indexOf(document.activeElement);
    if(e.shiftKey && i<=0){ e.preventDefault(); f[f.length-1].focus(); }
    else if(!e.shiftKey && i===f.length-1){ e.preventDefault(); f[0].focus(); }
  }
});
let tx = null;
lb.addEventListener('touchstart', e=>{ tx = e.touches[0].clientX; }, {passive:true});
lb.addEventListener('touchend', e=>{ if(tx===null) return; const dx = e.changedTouches[0].clientX - tx; if(Math.abs(dx)>50) step(dx<0?1:-1); tx=null; });

/* ---------- pinned header ---------- */
const topOffset = () => { const t = document.getElementById('topbar'); return t ? t.offsetHeight + 12 : 0; };
addEventListener('scroll', ()=>{
  const t = document.getElementById('topbar');
  if(t) t.classList.toggle('stuck', scrollY > 8);
}, {passive:true});

/* ---------- motion fx ---------- */
const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#/<>_*+';
const RV_SEL = '.bio,.hero .actions,.sec-head,.app,.stack-list li,.d-back,.d-hero,.d-box,.gallery .shot,.d-pager .btn,.foot .wrap > p.mono,.foot h2,.foot .mail,.foot .actions';
const SCR_SEL = '.sec-head .mono,.shots-bar .mono,.d-label,.foot .wrap > p.mono';
function scramble(el, dur){
  if(!FX || el.dataset.scr) return;
  const text = el.textContent;
  if(!text.trim()) return;
  el.dataset.scr = 1;
  dur = dur || Math.min(900, 260 + text.length * 30);
  const cs = getComputedStyle(el), ov = document.createElement('span');
  ov.className = 'scr'; ov.setAttribute('aria-hidden','true');
  ov.style.left = cs.paddingLeft; ov.style.top = cs.paddingTop;
  el.classList.add('scr-host'); el.appendChild(ov);
  const t0 = performance.now();
  (function f(now){
    const p = Math.min(1, (now - t0) / dur), n = Math.floor(p * text.length);
    let s = '';
    for(let i = 0; i < text.length; i++){ const c = text[i]; s += (i < n || /[\s·.,:|/-]/.test(c)) ? c : GLYPHS[Math.random() * GLYPHS.length | 0]; }
    ov.textContent = s;
    if(p < 1) requestAnimationFrame(f); else { ov.remove(); el.classList.remove('scr-host'); }
  })(t0);
}
const io = FX && 'IntersectionObserver' in window ? new IntersectionObserver(es=>{
  let k = 0;
  es.filter(e=>e.isIntersecting)
    .sort((a,b)=>(a.boundingClientRect.top - b.boundingClientRect.top) || (a.boundingClientRect.left - b.boundingClientRect.left))
    .forEach(e=>{
      const el = e.target, d = el.dataset.d != null ? +el.dataset.d : k++ * 70;
      io.unobserve(el);
      el.style.setProperty('--d', d + 'ms');
      el.classList.add('in');
      const targets = [...(el.matches(SCR_SEL) ? [el] : []), ...el.querySelectorAll(SCR_SEL)];
      if(targets.length) setTimeout(()=>targets.forEach(t=>scramble(t)), d + 120);
    });
}, {rootMargin:'0px 0px -6% 0px', threshold:.08}) : null;
function fxScan(scope, instant){
  if(!io) return;
  scope.querySelectorAll(RV_SEL).forEach(el=>{
    if(el.classList.contains('rv')) return;
    el.classList.add('rv');
    if(instant) el.classList.add('done'); else io.observe(el);
  });
}
if(FX){
  const bar = document.createElement('div');
  bar.className = 'progress'; bar.setAttribute('aria-hidden','true');
  document.body.appendChild(bar);
  let grid = null;
  if(matchMedia('(hover: hover) and (pointer: fine)').matches){
    grid = document.createElement('div');
    grid.className = 'grid-fx'; grid.setAttribute('aria-hidden','true');
    grid.innerHTML = '<i class="far"></i><i class="mid"></i><i class="near"></i>';
    document.body.prepend(grid);
    addEventListener('pointermove', e=>{
      grid.style.setProperty('--mx', e.clientX + 'px'); grid.style.setProperty('--my', e.clientY + 'px');
      grid.style.setProperty('--px', ((innerWidth / 2 - e.clientX) * .035).toFixed(1) + 'px');
      grid.style.setProperty('--py', ((innerHeight / 2 - e.clientY) * .035).toFixed(1) + 'px');
      grid.classList.add('on');
      // fade the spotlight out while the pointer is over text, so dots never compete with it
      const t = e.target;
      grid.classList.toggle('dim', !!(t && t.closest && t.closest('h1,h2,h3,p,a,button,li,dl,.mono,.tagline,.sec-head,.topbar')));
    }, {passive:true});
    document.documentElement.addEventListener('mouseleave', ()=>grid.classList.remove('on'));
  }
  let ticking = false;
  const upd = ()=>{
    ticking = false;
    const h = document.documentElement.scrollHeight - innerHeight;
    bar.style.setProperty('--p', h > 0 ? Math.min(1, scrollY / h) : 0);
    if(grid) grid.style.setProperty('--sy', -(scrollY % 24) + 'px');
  };
  addEventListener('scroll', ()=>{ if(!ticking){ ticking = true; requestAnimationFrame(upd); } }, {passive:true});
  addEventListener('resize', upd);
  new ResizeObserver(upd).observe(document.body);
}

/* ---------- load ---------- */
function load(){
  renderLoading();
  const state = Q.get('state');
  if(state === 'loading') return;
  const src = state === 'error' ? 'apps.missing.json' : (Q.get('data') || 'apps.json');
  fetch(src, {cache:'no-cache'})
    .then(r=>{ if(!r.ok) throw new Error(`GET ${src} → ${r.status} ${r.statusText||''}`.trim()); return r.json(); })
    .then(d=>{
      DATA = normalize(d);
      view = null;
      renderPage();
      route();
      const lbq = Q.get('lightbox');
      if(lbq){ const [ai,k] = lbq.split('-').map(Number); const a = DATA.apps[ai]; if(a && a.shots[k]) openLb(a.i, k); }
    })
    .catch(renderError);
}
load();
})();
</script>
